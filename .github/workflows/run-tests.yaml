name: Run tests

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: "true"
            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
            - name: Install pnpm
              uses: pnpm/action-setup@v6
              id: pnpm-install
            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - uses: actions/cache@v5
              name: Setup pnpm cache
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - name: Install dependencies
              run: pnpm install
              env: 
                  NPM_TOKEN: ${{ secrets.ENV }} 
            - name: Export environment variables to file
              run: echo "${{ secrets.ENV }}" > .env
            - name: Run unit tests
              run: pnpm run test:unit
            - name: Report test results
              uses: actions/github-script@v8
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');
                      const jsonPath = path.resolve(process.env.GITHUB_WORKSPACE, 'reports/unit.json');
                      
                      if (!fs.existsSync(jsonPath)) {
                        core.setFailed("The test report file 'reports/unit.json' was never created. Check the 'Run unit tests' step logs above for the real failure!");
                        return;
                      }

                      const report = require(jsonPath);
                      for (const file of report.testResults) {
                        for (const result of file.assertionResults) {
                          if (result.status === "passed") continue;
                          core.warning(result.failureMessages.join("\n"), {
                            title: "AssertionError",
                            file: file.name,
                            startLine: result.location.line,
                            startColumn: result.location.column,
                          });
                        }
                      }
              if: success() || failure()

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v7
              if: success() || failure()
    e2e-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: "true"
            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
            - name: Install pnpm
              uses: pnpm/action-setup@v6
              id: pnpm-install
            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - uses: actions/cache@v5
              name: Setup pnpm cache
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - name: Install dependencies
              run: pnpm install
            - name: Export environment variables to file
              run: echo "${{ secrets.ENV }}" > .env
            - name: Install playwright
              run: npx playwright install
            - name: Run e2e tests
              run: pnpm run test:e2e
